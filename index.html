<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Harry - Poções</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="topo">
        <h1>⚡ HOGWARTS - AVALIAÇÃO MÁGICA ⚡</h1>
        <p>Decifre a magia do Código Mestre LH</p>
    </div>

    <div class="container">

        <!-- PARTE 1: CHAPÉU SELETOR -->
        <div class="card-principal">
            <h2>🎩 O Chapéu Seletor</h2>
            <p>Escolha sua casa mágica para começar o ritual</p>
            
            <div class="chapeu-area">
                <div class="chapeu-icone">🎩</div>
                <p id="frase-chapeu">Leais e justos!</p>
                <button class="btn-vermelho" onclick="sortearCasa()">SORTEAR MINHA CASA!</button>
                <h2 id="resultado-casa" class="casa-lufa">LUFA-LUFA!</h2>
            </div>

            <div class="botoes-casa">
                <button class="btn-casa grif" onclick="escolherCasa('Grifinória')">🦁 Grifinória</button>
                <button class="btn-casa sonse" onclick="escolherCasa('Sonserina')">🐍 Sonserina</button>
                <button class="btn-casa corv" onclick="escolherCasa('Corvinal')">🦅 Corvinal</button>
                <button class="btn-casa lufa" onclick="escolherCasa('Lufa-Lufa')">🦡 Lufa-Lufa</button>
            </div>
        </div>

        <!-- PARTE 2: RITUAL E INVENTÁRIO LADO A LADO -->
        <div class="duplo">
            <!-- Ritual -->
            <div class="card-principal">
                <h2>🧪 Ritual de Poções</h2>
                <label>Nome do Feitiço / Poção</label>
                <input type="text" id="nomePocao" placeholder="Ex: Poção Polissuco">
                
                <label>Nível de Dificuldade</label>
                <select id="nivel">
                    <option>Fácil - Iniciante</option>
                    <option>Médio - Avançado</option>
                    <option>Difícil - Mestre</option>
                </select>

                <label>Avaliação da Magia</label>
                <div class="estrelas">
                    <span onclick="avaliar(1)">★</span>
                    <span onclick="avaliar(2)">★</span>
                    <span onclick="avaliar(3)">★</span>
                    <span onclick="avaliar(4)">★</span>
                    <span onclick="avaliar(5)">★</span>
                </div>

                <button class="btn-amarelo" onclick="registrarFeitico()">Registrar Avaliação</button>
            </div>

            <!-- Inventário -->
            <div class="card-principal">
                <h2>💜 Inventário de Poções</h2>
                <div class="item-pocao">
                    <span class="bolinha roxa"></span> <b>Poção do Amor</b><br
